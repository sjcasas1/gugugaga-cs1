name: m2391-sync-and-build

# 单一输入 expected_version（直接粘 adb shell uname -r 的结果）。
# 流水线自动：从串里反推 commit + android/KMI 标签，校验上游 Makefile/build.config 能否复现该串，
# 然后钉住该 commit、写死 CONFIG_LOCALVERSION、编 Image、出 AK3 包。

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: '留空 = 自动用上游 HEAD 的版本串；填了 = 钉死该串对应的 commit'
        default: ''
        required: false
      kernel_repo:
        description: 'upstream repo (owner/name)'
        default: 'baizhi958216/android_kernel_meizu_m2391'
        required: true
      kernel_branch:
        description: 'branch'
        default: 'oss/lineage-24.0'
        required: true
      make_release:
        description: 'create a GitHub Release'
        default: 'true'
        required: false
  schedule:
    - cron: '0 18 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'
      - 'm2391-droidspaces/**'

permissions:
  contents: write

concurrency:
  group: m2391-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      ARCH: arm64
      DEFCONFIG: m2391_defconfig
      KBUILD_BUILD_USER: gh-actions
      KBUILD_BUILD_HOST: github
      KBUILD_BUILD_TIMESTAMP: '2026-01-01 00:00:00 UTC'
      EXPECTED_VERSION: ${{ inputs.expected_version || '' }}
      KR_REPO: ${{ inputs.kernel_repo || 'baizhi958216/android_kernel_meizu_m2391' }}
      KR_BRANCH: ${{ inputs.kernel_branch || 'oss/lineage-24.0' }}
      MAKE_RELEASE: ${{ inputs.make_release || 'true' }}
      JOBS: 4
      OUT: ${{ github.workspace }}/build-out

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/.ghcup || true
          sudo apt-get clean
          df -h /

      - name: Ensure swap (best effort)
        continue-on-error: true
        run: |
          SWAP_MB=$(free -m | awk '/^Swap:/{print $2+0}')
          if [ "$SWAP_MB" -lt 4096 ]; then
            sudo swapoff -a || true; sudo rm -f /swapfile || true
            sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192 || true
            sudo chmod 600 /swapfile || true; sudo mkswap /swapfile || true; sudo swapon /swapfile || true
          fi
          free -h

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          for i in 1 2 3; do sudo apt-get update && break || sleep 10; done
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            dwarves cpio kmod rsync zip unzip python3 xz-utils patch git \
            clang-14 lld-14 llvm-14

      - name: Assemble toolchain in ~/clang/bin
        run: |
          mkdir -p "$HOME/clang/bin"
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip llvm-size llvm-link opt; do
            src=""
            if [ -x "/usr/lib/llvm-14/bin/$t" ]; then src="/usr/lib/llvm-14/bin/$t";
            elif command -v "$t" >/dev/null 2>&1; then src="$(command -v "$t")";
            elif command -v "$t-14" >/dev/null 2>&1; then src="$(command -v "$t-14")"; fi
            if [ -n "$src" ]; then ln -sf "$src" "$HOME/clang/bin/$t"; fi
          done
          test -x "$HOME/clang/bin/clang"; test -x "$HOME/clang/bin/ld.lld"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          "$HOME/clang/bin/clang" --version

      - name: Resolve version (auto from upstream HEAD, or from given string)
        id: pin
        run: |
          for i in 1 2 3; do rm -rf src; git clone --depth 1 --single-branch --branch "$KR_BRANCH" "https://github.com/$KR_REPO.git" src && break || sleep 15; done
          test -d src/.git
          cd src
          EXP="$EXPECTED_VERSION"
          if [ -n "$EXP" ]; then
            PARSED_SHA=$(printf '%s' "${EXP##*-g}" | sed -n 's/^\([0-9a-f]\{7,40\}\)$/\1/p')
            [ -n "$PARSED_SHA" ] || { echo "::error::cannot parse -g<sha> from $EXP"; exit 1; }
            git fetch --depth 1 origin "$PARSED_SHA"
            git checkout --detach FETCH_HEAD
            echo "pinned to commit from input string"
          else
            echo "no version input -> using upstream HEAD of $KR_BRANCH (auto-follow)"
          fi
          BASE=$(make -s kernelversion)
          BRANCH_VAL=$(sed -n 's/^BRANCH=//p' build.config.constants)
          KMI_VAL=$(sed -n 's/^KMI_GENERATION=//p' build.config.common)
          ANDROID_REL=$(printf '%s' "$BRANCH_VAL" | sed -n 's/^\(android[0-9]\{2,\}\)-.*/\1/p')
          [ -n "$ANDROID_REL" ] && [ -n "$KMI_VAL" ] || { echo "::error::cannot derive android release / KMI from build.config.*"; exit 1; }
          KMI_TAG="$ANDROID_REL-$KMI_VAL"
          SHA=$(git rev-parse --short=11 HEAD)
          DERIVED="$BASE-$KMI_TAG-g$SHA"
          echo "derived version: $DERIVED"
          if [ -n "$EXP" ] && [ "$DERIVED" != "$EXP" ]; then
            echo "::error::upstream yields $DERIVED but input expected $EXP"; exit 1
          fi
          echo "EXPECTED_VERSION=$DERIVED" >> "$GITHUB_ENV"
          echo "KERNEL_LOCALVERSION=-$KMI_TAG-g$SHA" >> "$GITHUB_ENV"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=$(echo "$SHA" | cut -c1-10)" >> "$GITHUB_OUTPUT"

      - name: Apply Droidspaces kABI patch and commit it
        run: |
          cd src
          PATCH="$GITHUB_WORKSPACE/m2391-droidspaces/0001-ABI-use-ABI-padding-for-SYSVIPC.patch"
          patch -p1 --dry-run < "$PATCH" || { echo "::error::kABI patch no longer applies (upstream sched.h changed)"; exit 1; }
          patch -p1 < "$PATCH"
          grep -q "android_kabi_reserved6" include/linux/sched.h || { echo "::error::kABI padding not found after patch"; exit 1; }
          git add -A && git -c user.name=gh-actions -c user.email=gh-actions@users.noreply.github.com commit -q -m "droidspaces: kABI-safe SYSVIPC padding"
          git status --porcelain | head -5

      - name: Integrate KernelSU (built-in, best effort)
        id: ksu
        continue-on-error: true
        run: |
          cd src
          curl -fsSL -o /tmp/ksu-setup.sh "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/master/kernel/setup.sh" && bash /tmp/ksu-setup.sh master || echo "KernelSU-Next setup failed"
          if [ -d drivers/kernelsu ]; then
            echo "ksu=yes" >> "$GITHUB_OUTPUT"
            git add -A && git -c user.name=gh-actions -c user.email=gh-actions@users.noreply.github.com commit -q -m "kernelsu: built-in" || true
          else
            echo "ksu=no" >> "$GITHUB_OUTPUT"
            echo "::warning::KernelSU-Next not integrated, kernel will boot without root"
          fi

      - name: Configure kernel
        run: |
          cd src
          make O="$OUT" ARCH=$ARCH LLVM=1 LLVM_IAS=1 $DEFCONFIG
          scripts/kconfig/merge_config.sh -m -O "$OUT" "$OUT/.config" "$GITHUB_WORKSPACE/m2391-droidspaces/droidspaces.config" >/dev/null
          make O="$OUT" ARCH=$ARCH LLVM=1 LLVM_IAS=1 olddefconfig >/dev/null
          scripts/config --file "$OUT/.config" --set-str LOCALVERSION "$KERNEL_LOCALVERSION"
          scripts/config --file "$OUT/.config" --disable LOCALVERSION_AUTO
          make O="$OUT" ARCH=$ARCH LLVM=1 LLVM_IAS=1 olddefconfig >/dev/null
          grep -q "CONFIG_LOCALVERSION=\"$KERNEL_LOCALVERSION\"" "$OUT/.config" || { echo "::error::LOCALVERSION not written"; exit 1; }
          grep -q "^# CONFIG_LOCALVERSION_AUTO is not set" "$OUT/.config" || { echo "::error::LOCALVERSION_AUTO still enabled"; exit 1; }
          grep -q "^CONFIG_ANDROID_KABI_RESERVE=y" "$OUT/.config" || { echo "::error::kABI padding disabled"; exit 1; }
          for opt in SYSVIPC POSIX_MQUEUE IPC_NS PID_NS DEVTMPFS; do
            grep -q "^CONFIG_${opt}=y" "$OUT/.config" || { echo "::error::missing CONFIG_${opt}=y"; exit 1; }
          done
          echo "--- key options ---"
          grep -E "^CONFIG_(KSU|SYSVIPC|IPC_NS|PID_NS|DEVTMPFS|USER_NS|MACVLAN|OVERLAY_FS|FUSE_FS|ANDROID_KABI_RESERVE|LTO_CLANG_THIN)=" "$OUT/.config" || true

      - name: Build Image (ThinLTO)
        run: |
          cd src
          make O="$OUT" ARCH=$ARCH LLVM=1 LLVM_IAS=1 -j"$JOBS" Image
          REL=$(cat "$OUT/include/config/kernel.release")
          echo "kernel release: $REL"
          [ "$REL" = "$EXPECTED_VERSION" ] || { echo "::error::built $REL but expected $EXPECTED_VERSION (vendor modules would reject)"; exit 1; }
          free -h; df -h /

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp "$OUT/arch/arm64/boot/Image" dist/Image
          gzip -c dist/Image > dist/Image.gz
          cp "$OUT/.config" dist/kernel.config
          cat "$OUT/include/config/kernel.release" > dist/KERNEL_VERSION.txt
          ls -l dist

      - name: Validate anykernel.sh (shell syntax)
        run: |
          sh -n m2391-droidspaces/anykernel.sh || { echo "::error::anykernel.sh has a shell syntax error (values must not contain unquoted parens)"; exit 1; }
          grep -q '^kernel.string="' m2391-droidspaces/anykernel.sh || echo "::warning::kernel.string should be quoted"
          grep -q '^is_slot_device=1' m2391-droidspaces/anykernel.sh || echo "::warning::is_slot_device is not 1 (device is A/B)"
      - name: Build AnyKernel3 zip (A/B)
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3.git /tmp/ak3
          rm -rf /tmp/ak3/.git
          cp dist/Image /tmp/ak3/Image
          cp m2391-droidspaces/anykernel.sh /tmp/ak3/anykernel.sh
          ( cd /tmp/ak3 && zip -r9 ../kernel-m2391-droidspaces.zip . -x "*.git*" > /dev/null )
          cp /tmp/kernel-m2391-droidspaces.zip dist/

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-m2391-${{ steps.pin.outputs.short }}-r${{ github.run_number }}
          path: dist/
          retention-days: 30

      - name: Publish GitHub Release
        if: env.MAKE_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KV=$(cat dist/KERNEL_VERSION.txt)
          TAG="build-$(date +%Y%m%d)-${{ steps.pin.outputs.short }}-r${{ github.run_number }}a${{ github.run_attempt }}"
          gh release create "$TAG" dist/Image dist/Image.gz dist/kernel.config dist/KERNEL_VERSION.txt dist/kernel-m2391-droidspaces.zip \
            --title "$KV" \
            --notes "expected: ${{ env.EXPECTED_VERSION }} upstream: ${{ env.KR_REPO }}@${{ env.KR_BRANCH }} commit: ${{ steps.pin.outputs.sha }} kabi_padding: yes lto: thin kernelsu: ${{ steps.ksu.outputs.ksu }}"

      - name: Record last build
        run: |
          KV=$(cat dist/KERNEL_VERSION.txt)
          cat > last-build.json <<EOF
          {
            "kernel_repo": "$KR_REPO",
            "kernel_branch": "$KR_BRANCH",
            "commit": "${{ steps.pin.outputs.sha }}",
            "kernel_version": "$KV",
            "kabi_padding": "yes",
            "lto": "thin",
            "kernelsu": "${{ steps.ksu.outputs.ksu }}",
            "run": "${{ github.run_number }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last-build.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "build: $KV"
          for i in 1 2 3; do git pull --rebase --autostash origin main >/dev/null 2>&1 || true; git push && break || sleep 5; done

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo "--- free/disk ---"; free -h || true; df -h / || true
          echo "--- kernel log ---"; sudo dmesg | tail -n 20 || true